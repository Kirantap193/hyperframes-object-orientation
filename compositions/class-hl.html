<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Frustrated developer, repeated code in yellow</title>

  <body>
    <template id="class-hl-template">
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .hl-team { position: absolute; left: 700px; top: 688px; width: 640px; height: 360px;

      <div data-hf-id="hf-672y" id="root" data-composition-id="class-hl" data-width="1920" data-height="1080" data-duration="13.6">
        <div data-hf-id="hf-h5sy" class="hl-team" id="hl-team">
          <div data-hf-id="hf-1pcu" class="hl-zoom" id="hl-zoom"><img data-hf-id="hf-awil" src="assets/team-last.jpg" alt="The team; the developer on the right is frustrated"></div>
          <div data-hf-id="hf-fm5e" class="hl-tint" id="hl-tint"></div>
          <!-- storm cloud with a lightning bolt over his head -->
          <svg data-hf-id="hf-6lqf" class="hl-fx" id="hl-cloud" style="left:422px; top:2px" width="156" height="92" viewBox="0 0 156 92">
            <path data-hf-id="hf-grnk" d="M30 60 C8 60 6 34 26 30 C24 12 50 4 62 18 C70 2 100 4 104 22 C122 14 146 28 136 46 C152 52 146 72 128 70 L34 70 Z" fill="#4b5160" stroke="#1d2027" stroke-width="4" stroke-linejoin="round" />
            <path data-hf-id="hf-f0qo" d="M44 40 q10 -10 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#2a2e37" stroke-width="3" stroke-linecap="round" />
            <path data-hf-id="hf-1iws" d="M80 66 L68 84 L80 82 L72 92 L94 74 L82 76 L90 66 Z" fill="#ffd43b" stroke="#7a5200" stroke-width="2" stroke-linejoin="round" />
          </svg>
          <!-- anger mark -->
          <svg data-hf-id="hf-yqgr" class="hl-fx" id="hl-anger" style="left:552px; top:53px" width="54" height="54" viewBox="0 0 54 54">
            <g data-hf-id="hf-b8vy" fill="none" stroke="#e8202a" stroke-width="7" stroke-linecap="round">
              <path data-hf-id="hf-u56q" d="M6 20 Q20 20 20 6" /><path data-hf-id="hf-mwwc" d="M34 6 Q34 20 48 20" /><path data-hf-id="hf-c4vm" d="M48 34 Q34 34 34 48" /><path data-hf-id="hf-3lsc" d="M20 48 Q20 34 6 34" />
            </g>
          </svg>
          <!-- sweat drops -->
          <svg data-hf-id="hf-b3wq" class="hl-fx" id="hl-drop1" style="left:434px; top:85px" width="22" height="32" viewBox="0 0 22 32">
            <path data-hf-id="hf-uos5" d="M11 2 C11 2 2 16 2 22 a9 9 0 0 0 18 0 C20 16 11 2 11 2 Z" fill="#8fd8ff" stroke="#1f6f9e" stroke-width="2" />
            <ellipse data-hf-id="hf-dlp1" cx="8" cy="21" rx="2.5" ry="4" fill="#ffffff" />
          </svg>
          <svg data-hf-id="hf-qyxf" class="hl-fx" id="hl-drop2" style="left:550px; top:125px" width="18" height="26" viewBox="0 0 22 32">
            <path data-hf-id="hf-lxd5" d="M11 2 C11 2 2 16 2 22 a9 9 0 0 0 18 0 C20 16 11 2 11 2 Z" fill="#8fd8ff" stroke="#1f6f9e" stroke-width="2" />
            <ellipse data-hf-id="hf-oax5" cx="8" cy="21" rx="2.5" ry="4" fill="#ffffff" />
          </svg>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="class-hl"]');
          var q = function (s) { return root.querySelector(s); };
          var tl = gsap.timeline({ paused: true });
          var F_IN = 0.0, F_OUT = 4.4;

          // ---- 1. Frustrated developer ----
          tl.fromTo("#hl-zoom", { scale: 1 }, { scale: 2.1, duration: 0.7, ease: "power2.inOut" }, F_IN);
          tl.fromTo("#hl-cloud", { opacity: 0, y: -30, scale: 0.6 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, F_IN + 0.8);
          tl.fromTo("#hl-cloud", { x: 0 }, { x: 6, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 9,
            immediateRender: false }, F_IN + 1.3);
          tl.fromTo("#hl-anger", { opacity: 0, scale: 0 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, F_IN + 1.2);
          tl.fromTo("#hl-anger", { scale: 1 }, { scale: 1.25, duration: 0.22, ease: "power1.inOut", yoyo: true, repeat: 7,
            immediateRender: false }, F_IN + 1.5);
          ["#hl-drop1", "#hl-drop2"].forEach(function (d, i) {
            var at = F_IN + 1.5 + i * 0.35;
            tl.fromTo(d, { opacity: 0, y: 0 }, { opacity: 1, y: 6, duration: 0.25, ease: "power1.out" }, at);
            tl.to(d, { y: 34, duration: 1.4, ease: "power1.in" }, at + 0.25);
            tl.to(d, { opacity: 0, duration: 0.3 }, at + 1.4);
          });
          tl.fromTo("#hl-tint", { opacity: 0 }, { opacity: 0.22, duration: 0.3, yoyo: true, repeat: 3 }, F_IN + 1.2);
          tl.fromTo("#hl-team", { x: 0 }, { x: 5, duration: 0.05, ease: "none", yoyo: true, repeat: 9 }, F_IN + 1.25);
          // ... then he calms down: effects go, the camera pulls back out
          tl.to(["#hl-cloud", "#hl-anger"], { opacity: 0, duration: 0.35 }, F_OUT - 0.4);
          tl.to("#hl-zoom", { scale: 1, duration: 0.6, ease: "power2.inOut" }, F_OUT);

          // ---- 2. Repeated code turns yellow ----
          var C = [218, 224, 0.621], P = [218, 603, 0.62, 50.839999999999996], TX = [138, 600];
          var SR = [[155, 199], [199, 236], [236, 277], [277, 327]], BR = [[347.0, 378.3], [378.3, 409.6], [409.6, 440.9], [440.9, 472.2], [472.2, 503.5], [503.5, 534.8], [534.8, 566.1]];
          function rowWin(x0, y0, s, img, w, h, r, dy, id) {
            var d = document.createElement("div"); d.className = "hl-row"; d.id = id;
            d.style.left = x0 + TX[0] * s + "px"; d.style.top = y0 + dy + r[0] * s + "px";
            d.style.width = (TX[1] - TX[0]) * s + "px"; d.style.height = (r[1] - r[0]) * s + "px";
            d.style.backgroundImage = "url(" + img + ")";
            d.style.backgroundSize = w * s + "px " + h * s + "px";
            d.style.backgroundPosition = (-TX[0] * s) + "px " + (-r[0] * s) + "px";
            root.appendChild(d); return d;
          }
          function card(geo, img, w, h, behDy, at, pfx) {
            var rows = [];
            SR.forEach(function (r, i) { rows.push(rowWin(geo[0], geo[1], geo[2], img, w, h, r, 0, pfx + "s" + i)); });
            BR.forEach(function (r, i) { rows.push(rowWin(geo[0], geo[1], geo[2], img, w, h, r, behDy, pfx + "b" + i)); });
            rows.forEach(function (d, i) {
              tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, at + i * 0.12);
            });
          }
          card(C, "assets/cd-cust-y.png", 496, 600, 0, 5.6, "hl-c");
          card(P, "assets/cd-plat-y.png", 646, 600, P[3], 8.2, "hl-p");

          window.__timelines["class-hl"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
