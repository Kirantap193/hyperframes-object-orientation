<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Food order clip</title>
  </head>
  <body>
    <template id="food-order-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          background: #010101;
        }
        .fo-wrap { position: absolute; inset: 0; opacity: 0; }
        .fo-video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      </style>

      <!-- The user's clip (10 s at 24 fps). Source 0 - 7.36 s at 0.8x  -> 0 - 9.2 s here (video 10.8 - 20.0 s);
           source 7.36 - 10 s at 0.64x (slowed again, the ending ran too fast) -> 9.2 - 13.325 s. -->
      <div data-hf-id="hf-9db2" id="root" data-composition-id="food-order" data-width="1920" data-height="1080" data-duration="13.325">
        <div data-hf-id="hf-w71y" class="fo-wrap">
          <video data-hf-id="hf-67o1" id="fo-video" class="fo-video clip" src="assets/food-order.mp4" data-start="0" data-duration="9.2" data-media-start="0" data-playback-rate="0.8" data-track-index="0" muted playsinline></video>
          <video data-hf-id="hf-sx29" id="fo-video2" class="fo-video clip" src="assets/food-order.mp4" data-start="9.2" data-duration="4.125" data-media-start="7.36" data-playback-rate="0.64" data-track-index="1" muted playsinline></video>
        </div>
        <audio data-hf-id="hf-42lf" id="fo-audio" src="assets/food-order.mp4" data-start="0" data-duration="9.2" data-media-start="0" data-playback-rate="0.8" data-track-index="10"></audio>
        <audio data-hf-id="hf-0j09" id="fo-audio2" src="assets/food-order.mp4" data-start="9.2" data-duration="4.125" data-media-start="7.36" data-playback-rate="0.64" data-track-index="11"></audio>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var IN_DUR = 0.7;                      // the clip fades up from black
          var root = document.querySelector('[data-composition-id="food-order"]');
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(root.querySelector(".fo-wrap"), { opacity: 0 },
            { opacity: 1, duration: IN_DUR, ease: "power1.inOut" }, 0);
          window.__timelines["food-order"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
