<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>OOPS temple</title>
  </head>
  <body>
    <template id="oops-temple-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        /* The artwork is 1506 x 1044; shown at 0.96, centred on the 1920 x 1080 frame. */
        .ot-pos {
          position: absolute;
          left: 237px;
          top: 39px;
          width: 1506px;
          height: 1044px;
          transform: scale(0.96);
          transform-origin: 0 0;
        }
        .ot-temple { position: absolute; inset: 0; opacity: 0; transform-origin: 50% 60%; }
        .ot-img { position: absolute; left: 0; top: 0; width: 1506px; height: 1044px; }
        /* One window per letter onto the pillar's lettering (lifted from the user's second image). */
        .ot-ch {
          position: absolute;
          overflow: hidden;
          opacity: 0;
          background-repeat: no-repeat;
          transform-origin: 50% 50%;
        }
      </style>

      <div data-hf-id="hf-ot01" id="root" data-composition-id="oops-temple" data-width="1920" data-height="1080" data-duration="10.8">
        <div data-hf-id="hf-s6pk" class="ot-pos">
          <div data-hf-id="hf-yknw" id="ot-temple" class="ot-temple">
            <img data-hf-id="hf-csfm" class="ot-img" src="assets/oops-temple.webp" alt="A temple with OOPS on the pediment and four blank pillars">
            <div data-hf-id="hf-x044" id="ot-letters"></div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var IN_AT = 0, IN_DUR = 1.0;          // the temple fades in
          var FIRST = 1.6;                      // first pillar starts typing
          var CHAR = 0.075;                     // one letter every 0.075 s
          var POP = 0.18;                       // each letter's own pop
          var PAUSE = 1.0;                      // pause before the next pillar
          var OUT_AT = 10.0, OUT_DUR = 0.8;     // the whole temple fades out before the clip

          // Pillar lettering: box (x, y, w, h) in artwork pixels and the letter band edges,
          // top to bottom. The words read bottom to top, so letters type from the last band up.
          var PILLARS = [
            { img: "assets/oops-p1.png", x: 270, y: 415, w: 59, h: 399,
              e: [0, 40, 79, 91, 112, 149, 175, 209, 237, 265, 298, 332, 365, 399] },   // ENCAPSULATION
            { img: "assets/oops-p2.png", x: 566, y: 456, w: 59, h: 329,
              e: [0, 34, 71, 105, 142, 167, 179, 210, 238, 273, 309, 329] },            // INHERITANCE
            { img: "assets/oops-p3.png", x: 871, y: 425, w: 60, h: 383,
              e: [0, 45, 74, 86, 117, 146, 176, 217, 255, 289, 307, 347, 383] },       // POLYMORPHISM
            { img: "assets/oops-p4.png", x: 1176, y: 456, w: 61, h: 348,
              e: [0, 41, 82, 95, 123, 156, 189, 219, 245, 273, 303, 348] }              // ABSTRACTION
          ];

          var root = document.querySelector('[data-composition-id="oops-temple"]');
          var host = root.querySelector("#ot-letters");
          var tl = gsap.timeline({ paused: true });

          // The temple: fade in while settling up to full size.
          tl.fromTo("#ot-temple", { opacity: 0 },
            { opacity: 1, duration: IN_DUR, ease: "power1.inOut" }, IN_AT);
          tl.fromTo("#ot-temple", { scale: 0.86 },
            { scale: 1, duration: IN_DUR + 0.2, ease: "back.out(1.2)", immediateRender: false }, IN_AT);

          var t = FIRST;
          PILLARS.forEach(function (p, pi) {
            var n = p.e.length - 1;
            // Reading order: bottom band first.
            for (var k = n - 1; k >= 0; k--) {
              var el = document.createElement("div");
              el.className = "ot-ch";
              el.id = "ot-c" + pi + "-" + k;
              el.style.left = p.x + "px";
              el.style.top = (p.y + p.e[k]) + "px";
              el.style.width = p.w + "px";
              el.style.height = (p.e[k + 1] - p.e[k]) + "px";
              el.style.backgroundImage = "url(" + p.img + ")";
              el.style.backgroundPosition = "0 " + (-p.e[k]) + "px";
              host.appendChild(el);
              tl.fromTo(el, { opacity: 0, scale: 1.3 },
                { opacity: 1, scale: 1, duration: POP, ease: "back.out(2)" }, t);
              t += CHAR;
            }
            t += POP + PAUSE;
          });

          // Fade the finished temple out to black (a separate wrapper, so it never fights the fade-in).
          tl.fromTo(root.querySelector(".ot-pos"), { opacity: 1 },
            { opacity: 0, duration: OUT_DUR, ease: "power1.inOut" }, OUT_AT);

          window.__timelines["oops-temple"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
